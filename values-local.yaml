# Local development values for fplbot with custom domain
replicaCount: 1

image:
  repository: ghcr.io/justinmarkmarshall/fplbot
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: fplbot.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Remove resource constraints for single-node setup
resources: {}

# API Configuration - set via command line
config:
  enabled: true
  footballData:
    baseUrl: "https://api.football-data.org/v4/"
    apiToken: ""
  oddsApi:
    baseUrl: "https://api.the-odds-api.com/v4/sports/soccer_epl/odds"
    apiToken: ""

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5